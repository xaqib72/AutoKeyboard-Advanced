[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "autokeyboard-vision"
version = "1.1.0"
description = "Lazy image-template worker for AutoKeyboard Advanced"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
